# Dependency license check, run in CI as `cargo deny check licenses`.
# See docs/dsp-provenance.md#crate-dependencies.
#
# The allow-list holds the permissive licenses today's dependency tree uses.
# A crate offering a choice (`MIT OR Apache-2.0`) passes when any one choice
# is allowed. Copyleft licenses (GPL, LGPL, AGPL, MPL) stay off this list: a
# dependency that needs one is a design question, not a config change.

[graph]
# Check every feature and target, so an optional dependency (plugins,
# score-import, spectrogram) or a platform-only one can't slip through.
all-features = true

[licenses]
version = 2
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-3-Clause",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "Unicode-3.0",
  "Zlib",
]
confidence-threshold = 0.93
# An allowed license that no crate uses any more is reported, so the list
# stays matched to the tree.
unused-allowed-license = "warn"
