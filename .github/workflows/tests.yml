name: Tests

on:
  push:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

jobs:
  test:
    name: Run Unit Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    env:
      CARGO_HTTP_MULTIPLEXING: false
      CARGO_NET_RETRY: 10
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    steps:
      - name: Check Out Repository
        uses: actions/checkout@v4

      - name: Install Linux Audio Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev pkg-config

      - name: Install Stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo Artifacts
        uses: Swatinem/rust-cache@v2

      - name: Run Tests
        run: cargo test --lib --tests

      # Spectrogram analysis is off by default, so the run above compiles
      # none of it. Its tap is concurrent code: test it on every OS.
      - name: Run Spectrogram Tests
        run: cargo test --features spectrogram --lib --tests

  feature-tests:
    name: Run Feature-Gated Tests (Linux)
    runs-on: ubuntu-latest
    env:
      CARGO_HTTP_MULTIPLEXING: false
      CARGO_NET_RETRY: 10

    steps:
      - name: Check Out Repository
        uses: actions/checkout@v4

      - name: Install Linux Audio Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev pkg-config

      - name: Install Stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Cargo Artifacts
        uses: Swatinem/rust-cache@v2

      - name: Run Feature-Gated Tests
        run: cargo test --all-features --lib --tests

      - name: Check Spectrogram on wasm32
        run: cargo check --lib --target wasm32-unknown-unknown --features spectrogram
