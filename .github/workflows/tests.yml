name: Tests

# Pull requests run once per push to the PR; pushes to main run the full suite
# and save the build caches every PR restores from. Other branch pushes do not
# run CI on their own: open a PR (or dispatch manually) to test them.
#
# Windows tests run on every PR but sit outside the required CI check, so they
# report before merge without holding up a green CI. Check their result before
# merging.
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

# A new push to a PR supersedes its in-flight run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_HTTP_MULTIPLEXING: false
  CARGO_NET_RETRY: 10
  # Most of each test job is compiling and linking about 20 test binaries, and
  # full debuginfo makes both slower and the caches bigger. Panics and
  # backtraces still report file and line.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ github.event_name != 'pull_request' || steps.filter.outputs.code == 'true' }}
    steps:
      # A file counts as code unless every pattern says otherwise, so new
      # directories are tested by default. Only list paths no build or test
      # reads.
      - name: Filter Changed Paths
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v3
        with:
          predicate-quantifier: every
          filters: |
            code:
              - '**'
              - '!**/*.md'
              - '!LICENSE'
              - '!.gitignore'
              - '!opencode.json'
              - '!.claude/**'
              - '!docs/**'
              - '!skills/**'
              - '!scripts/**'
              - '!.github/workflows/release.yml'
              - '!.github/workflows/release-notices.yml'

  test:
    name: Run Unit Tests (ubuntu-latest)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Check Out Repository
        uses: actions/checkout@v4

      - name: Install Linux Audio Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev pkg-config

      - name: Install Stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo Artifacts
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Run Tests
        run: cargo test --lib --tests

  # Windows is the slowest job (about 5 minutes against under 4 for Linux), so
  # it is informational: CI does not wait for it, and a failure shows as its own
  # red check. Spectrogram analysis is off by default and its tap is concurrent
  # code, so test it here too; the feature is purely additive, so this run also
  # covers every default-feature test.
  windows-test:
    name: Run Unit Tests (windows-latest)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: windows-latest

    steps:
      - name: Check Out Repository
        uses: actions/checkout@v4

      - name: Install Stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo Artifacts
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # The retired install.ps1 stub must work in Windows PowerShell 5.1
      # (`powershell`) and PowerShell 7 (`pwsh`), both on this runner, so a
      # missing one fails the run here instead of skipping its test.
      - name: Run Tests
        env:
          FUGUE_REQUIRE_POWERSHELL: "1"
        run: cargo test --features spectrogram --lib --tests

  feature-tests:
    name: Run Feature-Gated Tests (Linux)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Check Out Repository
        uses: actions/checkout@v4

      - name: Install Linux Audio Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev pkg-config

      - name: Install Stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Cargo Artifacts
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Run Feature-Gated Tests
        run: cargo test --all-features --lib --tests

      - name: Check Spectrogram on wasm32
        run: cargo check --lib --target wasm32-unknown-unknown --features spectrogram

  # Formatting, lints and rustdoc links stay clean because a PR that breaks any
  # of them fails here. Clippy runs with every feature on and over tests,
  # examples and benches, with warnings denied; the default lint set only (no
  # pedantic or nursery). The docs build covers private items too, since most
  # of the module documentation lives on them.
  lint:
    name: Check Format, Lints and Docs
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Check Out Repository
        uses: actions/checkout@v4

      - name: Install Linux Audio Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev pkg-config

      # Pinned, unlike the test jobs, so a new stable release (and the clippy
      # lints it brings) can't turn every PR red on its own. Bump it
      # deliberately, fixing what the new lints report in the same PR.
      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: rustfmt, clippy

      - name: Cache Cargo Artifacts
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Check Formatting
        run: cargo fmt --check

      - name: Check Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Check Rustdoc Links
        env:
          RUSTDOCFLAGS: -D rustdoc::broken_intra_doc_links
        run: cargo doc --no-deps --all-features --document-private-items

  # Every crate in the dependency tree must carry a license on the allow-list
  # in deny.toml (see docs/dsp-provenance.md). It reads only Cargo metadata,
  # so it runs on every PR, docs-only ones included, in well under a minute.
  licenses:
    name: Check Dependency Licenses
    runs-on: ubuntu-latest

    steps:
      - name: Check Out Repository
        uses: actions/checkout@v4

      # Pinned (v2.1.1, which bundles cargo-deny 0.20.2) so a new cargo-deny
      # release can't turn every PR red on its own. Bump it deliberately.
      - name: Check Licenses
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25
        with:
          command: check licenses

  # One stable check that is green when tests passed or were rightly skipped,
  # so a docs-only PR still reports a result. Require this check, not the
  # individual jobs, if CI checks become required. It leaves out windows-test
  # on purpose (see above).
  ci:
    name: CI
    if: always()
    needs:
      - changes
      - test
      - feature-tests
      - lint
      - licenses
    runs-on: ubuntu-latest
    steps:
      - name: Check Job Results
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
