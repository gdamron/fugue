# cargo-about configuration for the notices file every library release archive
# carries (see scripts/generate-licenses.sh).
#
# `accepted` holds the licenses deny.toml allows; keep the two lists the same.
# A crate whose license is not listed here fails generation, so a new license is
# read and decided before it ships. The order is a preference: MIT comes first
# so a crate offering MIT OR Apache-2.0 ships its MIT file, which carries the
# crate's copyright line.
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "CDLA-Permissive-2.0",
    "ISC",
    "Unicode-3.0",
    "Zlib",
]
# Build dependencies stay in: proc macros and build scripts generate code that
# lands in the binaries.
ignore-build-dependencies = false
ignore-dev-dependencies = true
