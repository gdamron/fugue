[package]
name = "fugue"
version = "2026.8.0"
edition = "2021"
autoexamples = false

[lib]
crate-type = ["rlib", "staticlib", "cdylib"]

[dependencies]
rand = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
indexmap = "2.0"
hound = "3.5"
semver = "1"
base64 = { version = "0.23", optional = true }
schemars = { version = "1", optional = true }
roxmltree = { version = "0.21", optional = true }
zip = { version = "8", optional = true, default-features = false, features = [
  "deflate",
] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
sha2 = "0.11"
fs2 = "0.4"
cpal = "0.18"
ureq = "3.4"
url = "2.5"
# 0.21's default features. 0.22 adds Temporal to the defaults, which no code
# module can rely on yet and which adds the ICU calendar/timezone data.
boa_engine = { version = "0.22.0", default-features = false, features = [
  "float16",
  "xsum",
] }
claxon = "0.4.3"
flacenc = "0.5.1"
wasmtime = { version = "49.0.1", optional = true, features = [
  "component-model",
] }
wasmtime-wasi = { version = "49.0.1", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
  "AudioContext",
  "AudioDestinationNode",
] }

[features]
ffi = []
plugins = ["dep:wasmtime", "dep:wasmtime-wasi"]
rpc-schema = ["dep:schemars"]
score-import = ["dep:roxmltree", "dep:zip"]
# Spectrogram analysis of running audio: the master-output tap, the analyser
# and its transform. Off by default so offline, wasm and embedded builds carry
# none of it; the daemon enables it.
spectrogram = ["dep:base64"]

[dev-dependencies]
# Exhaustive interleaving models of the request queue (src/control_request).
loom = "0.7"
tempfile = "3.27.0"
wit-component = "0.258.0"
wit-bindgen = "0.61.0"

[[example]]
name = "examples"
path = "examples/examples.rs"

# Keep dev builds debuggable while giving the audio hot path enough headroom
# for high-polyphony inventions. Debug info and debug assertions stay enabled.
[profile.dev.package.fugue]
opt-level = 1
