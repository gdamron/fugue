# The library builds of core for other languages: the static and dynamic C
# libraries behind include/fugue.h (native, iOS and Android archives) and the
# wasm module behind the web archive. They live in their own crate so a Rust
# consumer of `fugue` links only its rlib. The library keeps the name `fugue`,
# so the artifacts keep today's names (libfugue.a, libfugue.dylib, fugue.dll,
# fugue.wasm) and the packaging scripts read them from the same paths. Crate
# types cannot depend on the target, so a wasm build that needs only the
# module asks for it: `cargo rustc -p fugue-ffi --crate-type cdylib`.
[package]
name = "fugue-ffi"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lib]
name = "fugue"
path = "src/lib.rs"
crate-type = ["staticlib", "cdylib"]
# Its docs would collide with the `fugue` crate's under target/doc/fugue.
doc = false
test = false

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
fugue-core = { package = "fugue", path = "..", features = ["ffi"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
fugue-core = { package = "fugue", path = ".." }
